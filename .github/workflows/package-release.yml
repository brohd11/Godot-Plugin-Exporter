# Reusable release build for a PackageExporter package (callers come from add_release_workflow).
# Builds the package from pinned tags with a released package_exporter as toolchain, compile-checks
# the output on its own, then attaches the zips to the tag's GitHub release.
name: package-release

on:
  workflow_call:
    inputs:
      godot-version:
        description: Godot to build and verify on - a godot-builds release name (4.6.3-stable, 4.8-beta1); a bare 4.7 means 4.7-stable.
        type: string
        default: "4.6.3-stable"
      toolchain-version:
        description: package_exporter release to build with; empty means its latest release.
        type: string
        default: ""
      install-path:
        description: Where the package installs (addons/...); empty reads path= from its cfg, then export_folder from its export config.
        type: string
        default: ""
      publish:
        description: Attach the zips to the tag's release; false builds and verifies only.
        type: boolean
        default: true

env:
  TOOLCHAIN_REPO: brohd11/godot-package-exporter
  # Oldest Godot package_exporter itself runs on.
  GODOT_FLOOR: "4.6"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      WS: ${{ github.workspace }}/ws
    steps:
      - uses: actions/checkout@v4
        with:
          path: pkg
          fetch-depth: 0

      - name: Read package cfg
        id: pkg
        shell: bash
        env:
          INSTALL_PATH: ${{ inputs.install-path }}
          PUBLISH: ${{ inputs.publish }}
          GODOT_VERSION: ${{ inputs.godot-version }}
        run: |
          set -euo pipefail
          godot="$GODOT_VERSION"
          case "$godot" in *-*) ;; *) godot="$godot-stable" ;; esac
          IFS=. read -r major minor _ <<< "${godot%%-*}"
          IFS=. read -r fmajor fminor <<< "$GODOT_FLOOR"
          if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ ]]; then
            echo "::error::godot-version \"$GODOT_VERSION\" isn't a Godot version"; exit 1
          fi
          if (( major * 1000 + minor < fmajor * 1000 + fminor )); then
            echo "::error::godot-version $godot is too old: package_exporter runs on Godot $GODOT_FLOOR+"; exit 1
          fi
          echo "godot=$godot" >> "$GITHUB_OUTPUT"

          cfg=""
          for name in plugin.cfg version.cfg addon.cfg; do
            if [ -f "pkg/$name" ]; then cfg="pkg/$name"; break; fi
          done
          [ -n "$cfg" ] || { echo "::error::no plugin.cfg / version.cfg / addon.cfg at the repo root"; exit 1; }
          # First `key="value"` line; a missing key is "", not a pipefail exit.
          value() { grep -m1 -E "^$1[[:space:]]*=" "$cfg" | sed -E 's/^[^=]*=[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/' || true; }

          version=$(value version)
          [ -n "$version" ] || { echo "::error::no version= in $cfg"; exit 1; }
          # export_release builds whatever tag matches version=, so a mismatched push would ship another tag.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME doesn't match version=\"$version\" in $cfg"; exit 1
            fi
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::publishing needs a tag push; run with publish: false to only build"; exit 1
          fi

          path="$INSTALL_PATH"
          [ -n "$path" ] || path=$(value path)
          if [ -z "$path" ]; then
            # Packages have one of the two dirs, so an unmatched glob is expected.
            path=$(grep -h -m1 -E '^[[:space:]]*export_folder:' pkg/_export_ignore/*.yml pkg/export_ignore/*.yml 2>/dev/null \
              | head -1 | sed -E 's/^[[:space:]]*export_folder:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/') || true
          fi
          case "$path" in
            ""|*"{{"*) echo "::error::can't tell where the package installs: set path= in $cfg or pass install-path"; exit 1 ;;
            addons/package_exporter) echo "::error::package_exporter installs where the toolchain lives; release it from the editor"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "path=${path%/}" >> "$GITHUB_OUTPUT"

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ steps.pkg.outputs.godot }}-linux

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GODOT_VERSION: ${{ steps.pkg.outputs.godot }}
        run: |
          set -euo pipefail
          mkdir -p ~/godot && cd ~/godot
          name="Godot_v${GODOT_VERSION}_linux.x86_64"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${name}.zip"
          unzip -q godot.zip && rm godot.zip && mv "$name" godot

      - run: echo "$HOME/godot" >> "$GITHUB_PATH"

      # Tag mirrors, release zips, toolchains and workspaces; tags are trusted as immutable.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/package_exporter
          key: package-exporter-${{ github.repository }}-${{ hashFiles('pkg/*.cfg', 'pkg/_export_ignore/*', 'pkg/export_ignore/*.yml') }}
          restore-keys: package-exporter-${{ github.repository }}-

      - name: Assemble project
        shell: bash
        env:
          TOOLCHAIN_VERSION: ${{ inputs.toolchain-version }}
          GODOT_VERSION: ${{ steps.pkg.outputs.godot }}
          PKG_PATH: ${{ steps.pkg.outputs.path }}
        run: |
          set -euo pipefail
          v="$TOOLCHAIN_VERSION"
          [ -n "$v" ] || v=$(gh release view -R "$TOOLCHAIN_REPO" --json tagName -q .tagName)
          v="${v#v}"
          gh release download "v$v" -R "$TOOLCHAIN_REPO" -p "package-exporter-$v.zip" -D "$RUNNER_TEMP" \
            || gh release download "$v" -R "$TOOLCHAIN_REPO" -p "package-exporter-$v.zip" -D "$RUNNER_TEMP"
          echo "toolchain package_exporter $v"

          # The toolchain zip carries its install layout (addons/package_exporter); the package joins
          # it at its own install path, .git included - the export fetches it by tag from origin.
          mkdir -p "$WS"
          unzip -q "$RUNNER_TEMP/package-exporter-$v.zip" -d "$WS"
          mkdir -p "$WS/$(dirname "$PKG_PATH")"
          mv pkg "$WS/$PKG_PATH"
          # The same header ReleaseRunner.project_godot writes for its workspaces.
          features=$(echo "${GODOT_VERSION%%-*}" | cut -d. -f1,2)
          printf 'config_version=5\n\n[application]\n\nconfig/name="PE CI"\nconfig/features=PackedStringArray("%s")\n' "$features" > "$WS/project.godot"
          # Builds the class cache the exporter needs. The package's own deps aren't installed here,
          # so its scripts may log errors; only the exporter's have to load.
          godot --headless --path "$WS" --import || true

      - name: Release export
        id: export
        shell: bash
        env:
          PKG_PATH: ${{ steps.pkg.outputs.path }}
        run: |
          set -euo pipefail
          godot --headless --path "$WS" --script res://addons/package_exporter/src/class/release/release_cli.gd -- "$PKG_PATH" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          echo "zips=$(sed -n 's/^PE_RELEASE_OUTPUT //p' "$RUNNER_TEMP/export.log" | tail -1)" >> "$GITHUB_OUTPUT"

      # Lets a dry run (publish: false) be inspected; kept short since publishing keeps the real copy.
      - name: Collect zips
        shell: bash
        env:
          ZIPS: ${{ steps.export.outputs.zips }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zips"
          jq -r '.[]' <<< "$ZIPS" | while read -r f; do cp "$f" "$RUNNER_TEMP/zips/"; done

      - name: Upload zips
        uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: ${{ runner.temp }}/zips/
          retention-days: 7

      - name: Upload failed export
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-export-debug
          path: |
            ${{ runner.temp }}/export.log
            ${{ env.WS }}/**/*-unverified/**
          if-no-files-found: ignore

      - name: Publish
        if: inputs.publish
        shell: bash
        env:
          ZIPS: ${{ steps.export.outputs.zips }}
        run: |
          set -euo pipefail
          mapfile -t files < <(jq -r '.[]' <<< "$ZIPS")
          [ "${#files[@]}" -gt 0 ] || { echo "::error::the export reported no zips"; exit 1; }
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --title "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY"
          fi
